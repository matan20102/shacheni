# Checks every pull request and every push to main: Dart analysis, Flutter tests and the
# SQL tests (migrations + supabase/tests on an isolated PGlite database, no server access).
# Deploys are still done by Netlify; this workflow only reports whether the change is safe.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter analyze + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Keep in sync with netlify/build.sh.
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter --disable-analytics
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  sql:
    name: SQL migrations + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: supabase/tests/local/pglite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: supabase/tests/local/pglite/package-lock.json
      - run: npm ci
      - run: npm test
