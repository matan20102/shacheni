name: shacheni_app
description: "Shacheni (שכני) - private community app for apartment buildings"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^3.0.0
  go_router: ^17.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/fonts/OFL-Heebo.txt
  fonts:
    - family: Heebo
      fonts:
        - asset: assets/fonts/Heebo-Variable.ttf
