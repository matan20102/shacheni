name: shacheni_app
description: "NAYBOR (נייבור) - private community app for apartment buildings"
publish_to: 'none'
version: 0.1.0+11

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: 2.18.0
  scrollable_positioned_list: 0.3.8
  shared_preferences: 2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  http: 1.6.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL-Heebo.txt
    - assets/addresses/israel_streets.json
  fonts:
    - family: Heebo
      fonts:
        - asset: assets/fonts/Heebo-Variable.ttf
